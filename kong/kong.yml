_format_version: "2.1"
services:
  - name: profile-service
    url: http://profile:8080
    routes:
      - name: profile-route
        strip_path: false
        paths:
          - /api/v1/profiles
  - name: citations-service
    url: http://citations:8080
    routes:
      - name: citations-route
        strip_path: false
        paths:
          - /api/v1/citations
  - name: images-service
    url: http://images:8080
    routes:
      - name: images-route
        strip_path: false
        paths:
          - /api/v1/images
plugins:
  - name: key-auth
    config:
      key_names:
        - apikey
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:5173
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - apikey
      exposed_headers:
        - Authorization
      credentials: true
      max_age: 3600

consumers:
  - username: test-user
    keyauth_credentials:
      - key: one-citations-api-key
