_format_version: "2.1"
services:
  - name: profile-service
    url: http://profile:8080
    routes:
      - name: profile-route
        strip_path: false
        paths:
          - /api/v1/profiles
  - name: citations-service
    url: http://citations:8080
    routes:
      - name: citations-route
        strip_path: false
        paths:
          - /api/v1/citations
  - name: images-service
    url: http://images:8080
    routes:
      - name: images-route
        strip_path: false
        paths:
          - /api/v1/images
plugins:
  - name: key-auth
    config:
      key_names:
        - apikey
consumers:
  - username: test-user
    keyauth_credentials:
      - key: one-citations-api-key
