services:
  keycloak:
    build: ./keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_PASSWORD: keycloak
    ports:
      - 8085:8080
  mongo:
    image: mongo
    ports:
      - "27017:27017"
  profile:
    build: ./profiles-api
    ports:
      - 9080:8080
    environment:
      spring_profiles_active: security,docker
    depends_on:
      - mongo
  citations:
    build: ./citations-api
    ports:
      - 9081:8080
    environment:
      spring_profiles_active: security,docker
    depends_on:
      - mongo
  images:
    build: ./images-api
    ports:
      - 9082:8080
    environment:
      spring_profiles_active: security,docker
      logging.level.org.springframework.security: TRACE
      logging.level.org.springframework.web: TRACE
    depends_on:
      - mongo
  swagger:
    image: swaggerapi/swagger-ui
    environment:
      SWAGGER_JSON: /doc/citations.yaml
      DEEP_LINKING: "true"
      OAUTH2_REDIRECT_URL: http://localhost:8888/oauth2-redirect.html
      OAUTH_CLIENT_ID: swagger
      OAUTH_USE_PKCE: "true"
      OAUTH_REALM: tindeer
      OAUTH_APP_NAME: swagger
    ports:
      - 8888:8080
    volumes:
      - ./swagger:/doc
  kong:
    image: kong:3.4
    volumes:
      - ./kong:/usr/local/kong/declarative
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - kong
      - keycloak
